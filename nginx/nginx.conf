events {
    worker_connections 1024;
}

http {
    upstream ticket_service {
        server ticket-service:8001;
    }

    upstream event_streamer {
        server event-streamer:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Proxy all requests to TicketService (user-facing API)
        location / {
            proxy_pass http://ticket_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Optional: expose EventStreamer for debugging
        location /events/ {
            rewrite ^/events/(.*) /$1 break;
            proxy_pass http://event_streamer;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}