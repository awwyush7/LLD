# Compatible with both Docker Compose and Podman Compose
# Docker: docker compose up --build
# Podman: podman-compose -f podman-compose.yml up --build
#         (or use podman-compose.yml which has host.containers.internal instead)

services:
  # Kafka broker in KRaft mode (no Zookeeper needed)
  kafka:
    image: apache/kafka:3.7.0   # official Apache image — always public, no account needed
    container_name: carrental-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft: this node is both broker and controller
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      # Two listeners: PLAINTEXT for clients, CONTROLLER for internal raft
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # Fixed cluster ID required by KRaft (base64-encoded UUID)
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      # Topics are created on first produce/consume
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - carrental-net
    restart: unless-stopped

  # Booking service — handles slot reservations with DB transactions
  booking-service:
    build:
      context: .
      dockerfile: Zoom/CarRentalSystem/BookingService/Dockerfile
    container_name: carrental-booking-service
    environment:
      - DATABASE_URL=postgresql://postgres:Ayush%402002@postgres/carrental
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_GROUP_ID=booking-service-group
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - carrental-net
    restart: unless-stopped

  # Payment service — processes payments (stub for now)
  payment-service:
    build:
      context: .
      dockerfile: Zoom/CarRentalSystem/PaymentService/Dockerfile
    container_name: carrental-payment-service
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_GROUP_ID=payment-service-group
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - carrental-net
    restart: unless-stopped

  # Ingestion service — durable HTTP entry point (two-step transactional outbox)
  # Step 1: POST /booking-intent  → write to booking_intents (Postgres only)
  # Step 2: POST /confirm/{id}    → atomic UPDATE + outbox INSERT → OutboxRelay → Kafka
  ingestion-service:
    build:
      context: .
      dockerfile: Zoom/CarRentalSystem/IngestionService/Dockerfile
    container_name: carrental-ingestion-service
    environment:
      - DATABASE_URL=postgresql://postgres:Ayush%402002@postgres/carrental
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_GROUP_ID=ingestion-service-group
    ports:
      - "8003:8003"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - carrental-net
    restart: unless-stopped

  # Ticket service — pure consumer + read API (no longer accepts /book)
  ticket-service:
    build:
      context: .
      dockerfile: Zoom/CarRentalSystem/TicketService/Dockerfile
    container_name: carrental-ticket-service
    environment:
      - DATABASE_URL=postgresql://postgres:Ayush%402002@host.docker.internal/carrental
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_GROUP_ID=ticket-service-group
    ports:
      - "8001:8001"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - carrental-net
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # nginx — reverse proxy in front of TicketService
  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    container_name: carrental-nginx
    ports:
      - "80:80"
    depends_on:
      - ticket-service
      - event-streamer
    networks:
      - carrental-net
    restart: unless-stopped
  
  postgres:
    image: postgres:16-alpine
    container_name: carrental-postgres
    environment:
      - POSTGRES_DB=carrental
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Ayush@2002
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carrental"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - carrental-net
    restart: unless-stopped

networks:
  carrental-net:
    driver: bridge

volumes:
  postgres-data: