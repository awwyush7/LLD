apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-dashboard
spec:
  replicas: 1   # single instance — it's a scraper/dashboard, not on the request path
  selector:
    matchLabels:
      app: prometheus-dashboard
  template:
    metadata:
      labels:
        app: prometheus-dashboard
    spec:
      containers:
        - name: prometheus-dashboard
          image: carrental-prometheus-dashboard:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9100
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 5
