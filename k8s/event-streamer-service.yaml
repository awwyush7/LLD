apiVersion: v1
kind: Service
metadata:
  name: event-streamer   # THIS becomes the DNS name other pods use
spec:
  selector:
    app: event-streamer  # send traffic to any pod with this label
  ports:
    - port: 8000         # port the Service listens on (what other services call)
      targetPort: 8000   # port on the actual pod to forward to
  type: ClusterIP        # internal only — no external access
