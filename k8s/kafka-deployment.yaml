apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0   # official Apache Kafka image, always public
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092   # client port — services connect here
            - containerPort: 9093   # controller port — internal KRaft raft
          env:
            # KRaft: this single node is both broker and controller (no Zookeeper)
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"

            # Two listeners: PLAINTEXT for clients, CONTROLLER for KRaft election
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

            # KRaft quorum — single node, controller runs on localhost inside the pod
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            # Fixed cluster ID required by KRaft (base64-encoded UUID)
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"

            # Auto-create topics on first produce/consume — no manual setup needed
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"

            # Single-replica settings required for a 1-node cluster
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data   # apache/kafka stores logs here
      volumes:
        - name: kafka-data
          emptyDir: {}   # ephemeral — messages lost on pod restart (fine for learning)
