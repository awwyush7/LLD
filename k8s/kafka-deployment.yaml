apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092   # client port (services connect here)
            - containerPort: 9093   # controller port (internal KRaft raft)
          env:
            # KRaft: this single node is both broker and controller (no Zookeeper)
            - name: KAFKA_CFG_NODE_ID
              value: "0"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "controller,broker"

            # Two listeners: PLAINTEXT for clients inside the cluster,
            # CONTROLLER for the internal KRaft leader election
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

            # KRaft quorum: just this one node voting
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka:9093"
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            # Auto-create topics on first produce/consume — no manual setup needed
            - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
              value: "true"

            # Single-replica settings required for a 1-node cluster
            - name: KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
          readinessProbe:
            # TCP check: port 9092 open means the broker is accepting connections
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: kafka-data
              mountPath: /bitnami/kafka   # bitnami image stores logs here
      volumes:
        - name: kafka-data
          emptyDir: {}   # ephemeral — messages lost on pod restart (fine for learning)
