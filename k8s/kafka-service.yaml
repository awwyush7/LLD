apiVersion: v1
kind: Service
metadata:
  name: kafka   # DNS name other pods use: kafka:9092
spec:
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
  type: ClusterIP   # internal only — Kafka should never be exposed externally
