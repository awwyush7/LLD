apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 8   # matches KAFKA_NUM_PARTITIONS=8
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      initContainers:
        - name: wait-for-pgbouncer
          image: busybox
          command: ['sh', '-c', 'until nc -z pgbouncer 6432; do echo "waiting for pgbouncer..."; sleep 2; done']
        - name: wait-for-kafka
          image: busybox
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo "waiting for kafka..."; sleep 2; done; echo "Kafka port open — waiting for broker ready..."; sleep 10']
      containers:
        - name: payment-service
          image: carrental-payment-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8010   # /metrics only — no client-facing API
          env:
            # Through PgBouncer, not straight to postgres:5432 — see booking-service-deployment.yaml for why.
            - name: DATABASE_URL
              value: "postgresql://postgres:Ayush%402002@pgbouncer:6432/carrental"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: carrental-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_GROUP_ID
              value: "payment-service-group"
            - name: STRIPE_URL
              value: "http://mock-stripe:8004"
            - name: REDIS_URL
              value: "redis://redis:6379"
            # 8 pods × 8 connections = 64 pooled connections for payment (against pgbouncer, not Postgres directly)
            - name: DB_POOL_MAX_SIZE
              value: "8"
            - name: METRICS_PORT
              value: "8010"
          resources:
            requests:
              cpu: "100m"
              memory: "96Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
