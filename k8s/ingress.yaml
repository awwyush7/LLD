apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carrental-ingress
spec:
  rules:
    - http:
        paths:
          # API routes — must be listed before / so they match first
          - path: /book
            pathType: Prefix
            backend:
              service:
                name: ticket-service
                port:
                  number: 8001
          - path: /ticket
            pathType: Prefix
            backend:
              service:
                name: ticket-service
                port:
                  number: 8001
          # Everything else (/, /assets, etc) goes to the React frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
