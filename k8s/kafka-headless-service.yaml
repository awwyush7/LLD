apiVersion: v1
kind: Service
metadata:
  name: kafka-headless   # gives each pod a stable DNS name: kafka-0.kafka-headless, kafka-1.kafka-headless, kafka-2.kafka-headless
spec:
  clusterIP: None         # headless — required for StatefulSet pod-level DNS
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
