apiVersion: v1
kind: Secret
metadata:
  name: pgbouncer-secret
type: Opaque
data:
  # userlist.txt format required by PgBouncer: "user" "md5<hash>"
  # hash = md5(password + username), same scheme Postgres itself uses for md5 auth.
  # Decoded content: "postgres" "md553eddc2285377cfd71a4c6aeb0567a6e"
  userlist.txt: InBvc3RncmVzIiAibWQ1NTNlZGRjMjI4NTM3N2NmZDcxYTRjNmFlYjA1NjdhNmUiCg==
