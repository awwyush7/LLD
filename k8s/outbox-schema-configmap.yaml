apiVersion: v1
kind: ConfigMap
metadata:
  name: outbox-schema
data:
  # Mounted into shard-postgres containers at /docker-entrypoint-initdb.d/
  # Only needs the outbox table — ingestion pods write here, OutboxRelay reads here.
  # bookings/vehicles/tickets live in the main postgres.
  init.sql: |
    CREATE TABLE IF NOT EXISTS outbox (
        id               BIGSERIAL   PRIMARY KEY,
        topic            TEXT        NOT NULL,
        payload          JSONB       NOT NULL,
        published        BOOLEAN     NOT NULL DEFAULT false,
        created_at       TIMESTAMPTZ NOT NULL DEFAULT now(),
        idempotency_key  TEXT        UNIQUE
    );
    CREATE INDEX IF NOT EXISTS idx_outbox_unpublished ON outbox(id) WHERE published = false;
