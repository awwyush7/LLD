apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          # Before PgBouncer: 10 ingestion×15 + 8 booking×8 + 8 payment×8 + 2 ticket×8
          # = 310 real backend connections needed, hence max_connections=400.
          # After PgBouncer (transaction pooling, default_pool_size=25): every service
          # pool now multiplexes onto PgBouncer's shared backend pool instead of
          # holding its own live Postgres backend. Real backend connections drop to
          # roughly pgbouncer_replicas(2) × default_pool_size(25) = ~50, plus the
          # replica's replication connection — max_connections can come down accordingly.
          args: ["-c", "max_connections=120", "-c", "shared_buffers=256MB", "-c", "work_mem=4MB", "-c", "wal_level=replica", "-c", "max_wal_senders=5", "-c", "max_replication_slots=5"]
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "512Mi"
          ports:
            - containerPort: 5432
          env:
            # Pull non-sensitive config from ConfigMap
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: carrental-config
                  key: DB_NAME
            # Pull sensitive values from Secret
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: carrental-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carrental-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data  # where postgres stores its files
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/enable-replication.sh
              subPath: enable-replication.sh
          readinessProbe:                          # "is postgres ready to accept connections?"
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "carrental"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc              # use the PVC we created
        - name: postgres-init
          configMap:
            name: postgres-init
            defaultMode: 0755
