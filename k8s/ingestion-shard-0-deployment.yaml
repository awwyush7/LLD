apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-shard-0
spec:
  replicas: 4
  selector:
    matchLabels:
      app: ingestion-service
      shard: "0"
  template:
    metadata:
      labels:
        app: ingestion-service
        shard: "0"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: ['sh', '-c', 'until nc -z postgres-shard-0 5432; do sleep 2; done']
        - name: wait-for-kafka
          image: busybox
          command: ['sh', '-c', 'until nc -z kafka 9092; do sleep 2; done; sleep 10']
      containers:
        - name: ingestion-service
          image: carrental-ingestion-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8003
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:Ayush%402002@postgres-shard-0/carrental"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: carrental-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_GROUP_ID
              value: "ingestion-service-group"
            - name: DB_POOL_MAX_SIZE
              value: "15"
            - name: OUTBOX_BATCH_SIZE
              value: "500"
            - name: OUTBOX_POLL_INTERVAL
              value: "0.2"
          resources:
            requests:
              cpu: "100m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /docs
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 5
